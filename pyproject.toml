[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "truemsg"
version = "0.2.0"
description = "Offline lexical signals between commit messages and Git changes, for human review."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "truemsg contributors" }]
keywords = ["git", "commit", "lint", "pull-request", "ci", "developer-tools", "quality"]
dependencies = ["rich>=13.0.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.10,<1", "build>=1,<2"]

[project.urls]
Homepage = "https://github.com/LucasXlab/truemsg"
Repository = "https://github.com/LucasXlab/truemsg"
Issues = "https://github.com/LucasXlab/truemsg/issues"

[project.scripts]
truemsg = "truemsg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/truemsg"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "E9"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["truemsg"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.hatch.build.targets.sdist.force-include]
"assets/demo.cast" = "assets/demo.cast"
